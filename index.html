 <script src="/_sdk/0e8d3a91e1c6f495.data_sdk.js" integrity="sha512-c00oDoGjsMgluCLLEyVl3suwEkgjOGGplVFbsilUoBg4aMKNmsL3mwsc9r0dPn95qiSZyjBousQXgROkAW7p/w=="></script></head>
 <body data-template-id="__page-root" class="min-h-screen w-full" style="background: rgb(240, 253, 244);">
  <header class="border-b border-emerald-200 px-6 py-5">
   <h1 data-template-id="page-title" class="canva-text font-bold text-center" style="color: rgb(6, 95, 70); font-weight: bold; font-style: normal; font-size: 32px;">Cetak Nota Toko</h1>
  </header>
  <main class="max-w-3xl mx-auto p-6 space-y-8">
   <section data-template-id="form-section" class="canva-card rounded-xl p-6 shadow-sm" style="background: rgb(255, 255, 255);">
    <h2 data-template-id="form-heading" class="canva-text font-semibold mb-4" style="color: rgb(6, 95, 70); font-weight: 700; font-style: normal; font-size: 24px;">Buat Nota Baru</h2>
    <form id="nota-form" class="space-y-4">
     <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
       <label data-template-id="label-shop" class="canva-text block mb-1 text-sm font-medium" style="color: rgb(55, 65, 81); font-weight: 400; font-style: normal; font-size: 16px;">Nama Toko</label>
       <div class="w-full border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm font-semibold text-gray-700">
        DEDY TECHNOLOGY SOLUTION
       </div>
      </div>
      <div>
       <label data-template-id="label-customer" class="canva-text block mb-1 text-sm font-medium" for="customer_name" style="color: rgb(55, 65, 81); font-weight: 400; font-style: normal; font-size: 16px;">Nama Pelanggan</label> <input id="customer_name" type="text" required="" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-400 outline-none">
      </div>
     </div>
     <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
       <label data-template-id="label-date" class="canva-text block mb-1 text-sm font-medium" for="date_field" style="color: rgb(55, 65, 81); font-weight: 400; font-style: normal; font-size: 16px;">Tanggal</label> <input id="date_field" type="date" required="" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-400 outline-none">
      </div>
      <div>
       <label data-template-id="label-discount" class="canva-text block mb-1 text-sm font-medium" for="discount_field" style="color: rgb(55, 65, 81); font-weight: 400; font-style: normal; font-size: 16px;">Diskon (Rp)</label> <input id="discount_field" type="number" min="0" value="0" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-400 outline-none">
      </div>
      <div>
       <label data-template-id="label-notes" class="canva-text block mb-1 text-sm font-medium" for="notes_field" style="color: rgb(55, 65, 81); font-weight: 400; font-style: normal; font-size: 16px;">Catatan</label> <input id="notes_field" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-400 outline-none">
      </div>
     </div>
     <div>
      <label data-template-id="label-items" class="canva-text block mb-2 text-sm font-medium" style="color: rgb(55, 65, 81); font-weight: 400; font-style: normal; font-size: 16px;">Daftar Barang</label>
      <div id="items-container" class="space-y-2"></div><button data-template-id="add-item-btn" type="button" id="add-item-btn" class="canva-button mt-2 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1" style="background: rgb(209, 250, 229); color: rgb(6, 95, 70); font-weight: 500; font-style: normal; font-size: 16px;">Tambah Barang</button>
     </div>
     <div class="flex items-center justify-between bg-emerald-50 rounded-lg px-4 py-3">
      <span data-template-id="label-total" class="canva-text font-semibold" style="color: rgb(6, 95, 70); font-weight: 600; font-style: normal; font-size: 16px;">Total</span> <span id="total-display" class="text-xl font-bold text-emerald-700">Rp 0</span>
     </div><button data-template-id="submit-btn" type="submit" class="canva-button w-full py-2.5 rounded-lg font-semibold flex items-center justify-center gap-2" style="background: rgb(5, 150, 105); color: rgb(255, 255, 255); font-weight: 600; font-style: normal; font-size: 16px;">Simpan Nota</button>
    </form>
    <p id="form-msg" class="mt-3 text-center text-sm hidden"></p>
   </section>
   <section>
    <h2 data-template-id="history-heading" class="canva-text font-semibold mb-4" style="color: rgb(6, 95, 70); font-weight: 700; font-style: normal; font-size: 24px;">Riwayat Nota</h2>
    <p data-template-id="empty-state" id="empty-state" class="canva-text text-center py-6" style="color: rgb(107, 114, 128); font-weight: 400; font-style: italic; font-size: 16px;">Belum ada nota tersimpan.</p>
    <div id="history-list" class="space-y-4"></div>
   </section>
  </main>
  <template id="nota-template">
   <div data-template-id="nota-card" class="canva-card rounded-lg p-4 shadow-sm border border-gray-100">
    <div class="flex justify-between items-start">
     <div>
      <p data-template-id="nota-shop" class="canva-text font-bold"></p>
      <p data-template-id="nota-customer" class="canva-text text-sm"></p>
     </div>
     <div class="flex items-center gap-2">
      <span data-template-id="nota-date" class="canva-tag text-xs px-2 py-1 rounded"></span> <button class="print-btn text-emerald-600 hover:text-emerald-800" title="Cetak"><i data-lucide="printer" style="width:18px;height:18px"></i></button> <button class="delete-btn text-red-400 hover:text-red-600" title="Hapus"><i data-lucide="trash-2" style="width:16px;height:16px"></i></button>
     </div>
    </div>
    <div class="mt-2 text-sm text-gray-700 nota-items"></div>
    <p class="mt-1 text-sm text-orange-600 nota-discount"></p>
    <p class="mt-1 font-bold text-emerald-700 nota-total"></p>
   </div>
  </template>
  <script src="/_sdk/571d88ca352bbccf.editing_sdk.js" integrity="sha512-jpVzCgOJfgU8ETK2cVi9ukdjrZIqXjCspYqy9afx1TyeJ4jZxisBmh2SIlonXgbaxCv9M5yrk3WY4wZKWDC3Ig=="></script>
  <script src="/_sdk/0e8d3a91e1c6f495.data_sdk.js" integrity="sha512-c00oDoGjsMgluCLLEyVl3suwEkgjOGGplVFbsilUoBg4aMKNmsL3mwsc9r0dPn95qiSZyjBousQXgROkAW7p/w=="></script>
  <script>
    lucide.createIcons();
    const SHOP_NAME = 'DEDY TECHNOLOGY SOLUTION';
    const SHOP_CONTACT = '+62 851 5853 3379';
				const SHOPE_ADDRESS = 'Sangketan,Kabupaten Tabanan, Bali';
    let allData = [];
    const form = document.getElementById('nota-form');
    const itemsContainer = document.getElementById('items-container');
    const historyList = document.getElementById('history-list');
    const emptyState = document.getElementById('empty-state');
    const formMsg = document.getElementById('form-msg');
    const submitBtn = form.querySelector('[type="submit"]');
    const totalDisplay = document.getElementById('total-display');
    const discountField = document.getElementById('discount_field');

    document.getElementById('date_field').value = new Date().toISOString().split('T')[0];

    function createItemRow() {
      const row = document.createElement('div');
      row.className = 'grid grid-cols-12 gap-2 items-center';
      row.innerHTML = `
        <input type="text" placeholder="Nama barang" required class="col-span-4 border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-emerald-400 outline-none" data-field="name">
        <input type="number" placeholder="Qty" min="1" required class="col-span-2 border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-emerald-400 outline-none" data-field="qty">
        <input type="text" placeholder="Satuan" required class="col-span-2 border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-emerald-400 outline-none" data-field="unit">
        <input type="number" placeholder="Harga" min="0" required class="col-span-3 border border-gray-300 rounded-lg px-2 py-1.5 text-sm focus:ring-2 focus:ring-emerald-400 outline-none" data-field="price">
        <button type="button" class="col-span-1 text-red-400 hover:text-red-600 remove-row flex justify-center"><i data-lucide="x" style="width:16px;height:16px"></i></button>`;
      row.querySelector('.remove-row').addEventListener('click', () => { row.remove(); calcTotal(); });
      row.querySelectorAll('input[data-field="qty"],input[data-field="price"]').forEach(i => i.addEventListener('input', calcTotal));
      itemsContainer.appendChild(row);
      lucide.createIcons();
    }

    function calcTotal() {
      let subtotal = 0;
      itemsContainer.querySelectorAll(':scope > div').forEach(row => {
        const qty = Number(row.querySelector('[data-field="qty"]').value) || 0;
        const price = Number(row.querySelector('[data-field="price"]').value) || 0;
        subtotal += qty * price;
      });
      const disc = Number(discountField.value) || 0;
      const total = Math.max(0, subtotal - disc);
      totalDisplay.textContent = 'Rp ' + total.toLocaleString('id-ID');
    }
    discountField.addEventListener('input', calcTotal);

    function getItems() {
      const items = [];
      itemsContainer.querySelectorAll(':scope > div').forEach(row => {
        items.push({
          name: row.querySelector('[data-field="name"]').value.trim(),
          qty: Number(row.querySelector('[data-field="qty"]').value),
          unit: row.querySelector('[data-field="unit"]').value.trim(),
          price: Number(row.querySelector('[data-field="price"]').value)
        });
      });
      return items;
    }

    createItemRow();
    document.getElementById('add-item-btn').addEventListener('click', createItemRow);

    const handler = {
      onDataChanged(data) { allData = data; renderHistory(data); }
    };
    (async () => { const r = await window.dataSdk.init(handler); if (!r.isOk) showMsg('Gagal menghubungkan penyimpanan.', true); })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (allData.length >= 999) { showMsg('Batas 999 nota tercapai.', true); return; }
      const items = getItems();
      if (!items.length) { showMsg('Tambahkan minimal 1 barang.', true); return; }
      const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
      const discount = Number(discountField.value) || 0;
      const total = Math.max(0, subtotal - discount);
      submitBtn.disabled = true;
      const res = await window.dataSdk.create({
        shop_name: SHOP_NAME,
        customer_name: document.getElementById('customer_name').value.trim(),
        date: document.getElementById('date_field').value,
        items: JSON.stringify(items),
        total,
        discount,
        notes: document.getElementById('notes_field').value.trim()
      });
      submitBtn.disabled = false;
      if (res.isOk) { showMsg('Nota berhasil disimpan!', false); form.reset(); document.getElementById('date_field').value = new Date().toISOString().split('T')[0]; discountField.value = '0'; itemsContainer.innerHTML = ''; createItemRow(); calcTotal(); }
      else showMsg('Gagal menyimpan nota.', true);
    });

    function renderHistory(data) {
      const sorted = [...data].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      emptyState.classList.toggle('hidden', sorted.length > 0);
      const existing = new Map([...historyList.children].map(el => [el.dataset.id, el]));
      const fragment = document.createDocumentFragment();
      sorted.forEach(item => {
        let el = existing.get(item.__backendId);
        if (el) { updateCard(el, item); existing.delete(item.__backendId); }
        else el = createCard(item);
        fragment.appendChild(el);
      });
      existing.forEach(el => el.remove());
      historyList.appendChild(fragment);
    }

    function parseItems(str) { try { return JSON.parse(str); } catch { return []; } }

    function createCard(item) {
      const tpl = document.getElementById('nota-template');
      const clone = tpl.content.cloneNode(true);
      const div = clone.firstElementChild;
      div.dataset.id = item.__backendId;
      updateCard(div, item);
      div.querySelector('.print-btn').addEventListener('click', () => printNota(item));
      div.querySelector('.delete-btn').addEventListener('click', async () => 
        div.querySelector('.delete-btn').disabled = true;
        const r = await window.dataSdk.delete(item);
        if (!r.isOk) { div.querySelector('.delete-btn').disabled = false; showMsg('Gagal menghapus.', true); }
      });
      lucide.createIcons();
      return div;
    }

    function updateCard(el, item) {
      el.querySelector('[data-template-id="nota-shop"]').textContent = item.shop_name;
      el.querySelector('[data-template-id="nota-customer"]').textContent = 'Pelanggan: ' + item.customer_name;
      el.querySelector('[data-template-id="nota-date"]').textContent = item.date;
      const items = parseItems(item.items);
      el.querySelector('.nota-items').innerHTML = items.map(i => `<div class="flex justify-between gap-3"><span>${esc(i.name)} ${i.qty} ${esc(i.unit)}<span class="block text-xs text-gray-500">Harga satuan: Rp ${i.price.toLocaleString('id-ID')}</span></span><span class="shrink-0">Rp ${(i.qty*i.price).toLocaleString('id-ID')}</span></div>`).join('');
      const disc = Number(item.discount) || 0;
      el.querySelector('.nota-discount').textContent = disc > 0 ? 'Diskon: -Rp ' + disc.toLocaleString('id-ID') : '';
      el.querySelector('.nota-total').textContent = 'Total: Rp ' + Number(item.total).toLocaleString('id-ID');
    }

    function printNota(item) {
      const items = parseItems(item.items);
      const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);
      const disc = Number(item.discount) || 0;
      const lineItems = items.map(i => {
        const sub = i.qty * i.price;
        return `${esc(i.name)}\n  Harga satuan: Rp ${i.price.toLocaleString('id-ID')}\n  ${i.qty} ${esc(i.unit)}${' '.repeat(Math.max(1,24-sub.toLocaleString('id-ID').length))}Rp ${sub.toLocaleString('id-ID')}`;
      }).join('\n');
      const discLine = disc > 0 ? `<div class="row"><span>Diskon</span><span>-Rp ${disc.toLocaleString('id-ID')}</span></div>` : '';
      const w = window.open('', '_blank');
      w.document.write(`<html><head><title>Nota</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Courier New',monospace;font-size:11px;width:58mm;padding:3mm;margin:0 auto}h2{font-size:13px;text-align:center;font-weight:bold}p.center{text-align:center;font-size:10px}.line{border-top:1px dashed #000;margin:4px 0}.row{display:flex;justify-content:space-between;font-size:11px}.bold{font-weight:bold;font-size:12px}pre{white-space:pre-wrap;font-size:10px;line-height:1.5}@media print{body{width:58mm;padding:2mm}}</style></head><body>
<h2>${esc(SHOP_NAME)}</h2>
<p class="center">Sangketan,Kabupaten Tabanan, Bali</p>
<p class="center">${esc(SHOP_ADDRESS)}</p>
<p class="center">${esc(SHOP_CONTACT)}</p>
<div class="line"></div>
<p class="center" style="text-align:left">${esc(item.date)}  Pelanggan: ${esc(item.customer_name)}</p>
<div class="line"></div>
<pre>${lineItems}</pre>
<div class="line"></div>
<div class="row"><span>Subtotal</span><span>Rp ${subtotal.toLocaleString('id-ID')}</span></div>
${discLine}
<div class="row bold"><span>TOTAL</span><span>Rp ${Number(item.total).toLocaleString('id-ID')}</span></div>
${item.notes ? '<div class="line"></div><p style="font-size:9px">'+esc(item.notes)+'</p>' : ''}
<div class="line"></div>
<p class="center" style="margin-top:4px">Terima kasih atas kunjungan Anda!</p>
<p class="center">Barang yang sudah dibeli tidak dapat</p>
<p class="center">ditukar/dikembalikan</p>
<script>window.print()<\/script></body></html>`);
      w.document.close();
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function showMsg(text, isErr) {
      formMsg.textContent = text;
      formMsg.className = 'mt-3 text-center text-sm ' + (isErr ? 'text-red-600' : 'text-emerald-600');
      formMsg.classList.remove('hidden');
      setTimeout(() => formMsg.classList.add('hidden'), 3000);
    }
  </script>
 
</body></html>
